<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="grad_accent" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="grad_accent2" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square -->
  <rect x="20" y="20" width="360" height="360" rx="40" ry="40"
        fill="url(#grad)" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Subtle inner border -->
  <rect x="28" y="28" width="344" height="344" rx="34" ry="34"
        fill="none" stroke="#1f1f3a" stroke-width="1" opacity="0.5"/>

  <!-- Central circle -->
  <circle cx="200" cy="170" r="95" fill="none" stroke="url(#grad_accent2)" stroke-width="2.5"/>

  <!-- Play triangle -->
  <polygon points="175,130 175,210 235,170"
           fill="url(#grad_accent)" stroke="none"/>

  <!-- Small decorative dots -->
  <circle cx="140" cy="140" r="3" fill="#e94560" opacity="0.4"/>
  <circle cx="260" cy="130" r="2.5" fill="#e94560" opacity="0.3"/>
  <circle cx="270" cy="210" r="2" fill="#e94560" opacity="0.25"/>
  <circle cx="145" cy="220" r="2" fill="#e94560" opacity="0.35"/>

  <!-- Decorative line left -->
  <line x1="105" y1="100" x2="120" y2="105" stroke="#e94560" stroke-width="1.5" opacity="0.3"/>

  <!-- O C E bold letters -->
  <text x="200" y="325" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" fill="#ffffff" letter-spacing="12">
    OCE
  </text>

  <!-- Tagline -->
  <text x="200" y="352" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="10" fill="#666688" letter-spacing="4" text-transform="uppercase">
    ONE CLICK EXTRACTOR
  </text>

  <!-- Version badge -->
  <rect x="155" y="362" width="90" height="18" rx="9" ry="9" fill="#e94560" opacity="0.15" stroke="none"/>
  <text x="200" y="375" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="9" font-weight="500" fill="#e94560" opacity="0.8" letter-spacing="2">
    v3.1.0
  </text>
</svg>
