name: Provider Test (harness)

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma list provider ids, atau "all"'
        required: false
        default: 'all'
      query:
        description: 'Search query untuk tes'
        required: false
        default: 'naruto'
      episodes:
        description: 'Max episode per provider untuk test loadLinks'
        required: false
        default: '2'

concurrency:
  group: provider-test
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source (private)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-populate JitPack artifact in local Maven repo
        run: |
          BASE="$GITHUB_WORKSPACE/jitpack-local/com/github/recloudstream/gradle"
          LOCAL_REPO="$BASE/gradle/master-SNAPSHOT"
          mkdir -p "$LOCAL_REPO"
          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.jar" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.jar"
          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.pom" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.pom"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<metadata>' \
            '  <groupId>com.github.recloudstream.gradle</groupId>' \
            '  <artifactId>gradle</artifactId>' \
            '  <version>master-SNAPSHOT</version>' \
            '  <versioning>' \
            '    <snapshot>' \
            '      <localCopy>true</localCopy>' \
            '    </snapshot>' \
            '  </versioning>' \
            '</metadata>' > "$LOCAL_REPO/maven-metadata-local.xml"
          echo "✅ Local JitPack repo ready (master-SNAPSHOT)"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run provider harness
        run: |
          curl -sL "https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar" \
            -o /tmp/cs3-classes.jar
          CLOUDSTREAM3_JAR=/tmp/cs3-classes.jar \
          ./gradlew :BaseProvider:testDebugUnitTest \
            --tests '*ProviderHarnessTest*' \
            -Poce.harness=1 \
            -Poce.harness.providers="${{ inputs.providers }}" \
            -Poce.harness.query="${{ inputs.query }}" \
            -Poce.harness.episodes="${{ inputs.episodes }}" \
            -Poce.harness.out=/tmp/harness.md \
            --continue
          echo "---"
          cat /tmp/harness.md
          cat /tmp/harness.md >> "$GITHUB_STEP_SUMMARY"