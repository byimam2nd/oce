name: Health Check - Provider Observability

on:
  schedule:
    - cron: '20 22 * * *' # 05:20 WIB (UTC+7)
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Lebar jendela laporan (jam). Pakai 1 untuk mengisolasi tes manual.'
        required: false
        default: '24'

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run health analysis
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HEALTH_WINDOW_HOURS: ${{ inputs.window_hours || '24' }}
        run: |
          python3 scripts/health_check.py > /tmp/health.md 2> /tmp/health.err || {
            echo "::error::health_check.py gagal"; cat /tmp/health.err; exit 1; }
          {
            echo "## Provider Health (dari observability)";
            cat /tmp/health.md;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Provider Health Report"
          ISSUE=$(gh issue list --search "$TITLE in:title" --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --title "$TITLE" --body-file /tmp/health.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/health.md
          fi