name: CI/CD - Release (Stable)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ========================================
  # BUILD + TEST (always runs)
  # ========================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source (private)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-populate JitPack artifact in local Maven repo
        run: |
          BASE="$GITHUB_WORKSPACE/../jitpack-local/com/github/recloudstream/gradle"
          LOCAL_REPO="$BASE/gradle/master-SNAPSHOT"
          mkdir -p "$LOCAL_REPO"
          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.jar" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.jar"
          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.pom" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.pom"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<metadata>' \
            '  <groupId>com.github.recloudstream.gradle</groupId>' \
            '  <artifactId>gradle</artifactId>' \
            '  <version>master-SNAPSHOT</version>' \
            '  <versioning>' \
            '    <snapshot>' \
            '      <localCopy>true</localCopy>' \
            '    </snapshot>' \
            '  </versioning>' \
            '</metadata>' > "$LOCAL_REPO/maven-metadata-local.xml"
          echo "✅ Local JitPack repo ready (master-SNAPSHOT)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Build Environment
        env:
          OCE_TG_TOKEN: ${{ secrets.OCE_TG_TOKEN }}
          OCE_TG_GROUP_ID: ${{ secrets.OCE_TG_GROUP_ID }}
          OCE_TG_THREAD_ID: ${{ secrets.OCE_TG_THREAD_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          TAG_NAME=${GITHUB_REF_NAME#v}
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "OCE_VERSION=${TAG_NAME}" >> $GITHUB_ENV
          echo "SUPABASE_URL=${SUPABASE_URL}" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> $GITHUB_ENV
          echo "✅ Build environment set for tag: $TAG_NAME"

      - name: Validate provider configs
        run: |
          python3 scripts/validate_providers.py

      - name: Build Plugins (public repo URL)
        env:
          # Force plugins.json .cs3 URLs to point at the PUBLIC repo,
          # even though this workflow runs in the private source repo.
          OCE_REPO_URL: https://github.com/byimam2nd/oce
        run: |
          chmod +x ./gradlew
          ./gradlew make makePluginsJson --stacktrace

          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ $TAG_NAME == refs/heads/* ]]; then
            TAG_NAME="latest"
          fi
          echo "Using Tag: $TAG_NAME"

          # Replace raw.githubusercontent.com URLs with release download URLs
          # Original: https://raw.githubusercontent.com/byimam2nd/oce/builds/ProviderName.cs3
          # Target: https://github.com/byimam2nd/oce/releases/download/$TAG_NAME/ProviderName.cs3
          sed -i "s|https://raw.githubusercontent.com/byimam2nd/oce/builds/|https://github.com/byimam2nd/oce/releases/download/$TAG_NAME/|g" build/plugins.json

          # Move artifacts to a staging directory
          mkdir -p release-artifacts
          cp **/build/*.cs3 release-artifacts/ 2>/dev/null || true
          cp build/plugins.json release-artifacts/ 2>/dev/null || true
          rm -f release-artifacts/BaseProvider.cs3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

  # ========================================
  # CREATE GITHUB RELEASE on PUBLIC repo
  # (only when GitHub App secret is configured)
  # ========================================
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCE_DISTRIBUTOR_APP_ID: ${{ secrets.OCE_DISTRIBUTOR_APP_ID }}
      OCE_DISTRIBUTOR_APP_PEM: ${{ secrets.OCE_DISTRIBUTOR_APP_PEM }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OCE_DISTRIBUTOR_APP_ID }}
          private-key: ${{ secrets.OCE_DISTRIBUTOR_APP_PEM }}
          owner: byimam2nd
          repositories: oce

      - name: Download artifacts
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify token access (debug)
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "== token repo access =="
          gh api repos/byimam2nd/oce --jq '.full_name' || echo "TOKEN_NO_REPO_ACCESS"
          echo "== can create release? (dry) =="
          gh api -X POST repos/byimam2nd/oce/releases/generate-notes \
            -f tag_name=v3.11.0 2>&1 | head -c 300

      - name: Create GitHub Release (public repo)
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          echo "Creating release ${TAG_NAME} on byimam2nd/oce"
          gh release create "${TAG_NAME}" \
            --repo byimam2nd/oce \
            --title "${TAG_NAME}" \
            --notes "OCE stable release ${TAG_NAME}" \
            release-artifacts/*.cs3 \
            release-artifacts/plugins.json
          echo "✅ Release created"
