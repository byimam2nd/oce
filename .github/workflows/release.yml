name: CI/CD - Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ========================================
  # BUILD ALL PROVIDERS FOR RELEASE
  # ========================================
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-populate JitPack artifact in local Maven repo
        run: |
          JITPACK="https://jitpack.io/com/github/recloudstream/gradle"
          BASE="$GITHUB_WORKSPACE/../jitpack-local/com/github/recloudstream"

          # Primary path: groupId/com.github.recloudstream + artifactId/gradle + version
          LOCAL_REPO="$BASE/gradle/master-SNAPSHOT"
          mkdir -p "$LOCAL_REPO"
          curl -sL "$JITPACK/master-81b1d424d2-1/gradle-master-81b1d424d2-1.jar" -o "$LOCAL_REPO/gradle-master-SNAPSHOT.jar"
          curl -sL "$JITPACK/master-81b1d424d2-1/gradle-master-81b1d424d2-1.pom" -o "$LOCAL_REPO/gradle-master-SNAPSHOT.pom"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<metadata>' \
            '  <groupId>com.github.recloudstream</groupId>' \
            '  <artifactId>gradle</artifactId>' \
            '  <version>master-SNAPSHOT</version>' \
            '  <versioning>' \
            '    <snapshot>' \
            '      <localCopy>true</localCopy>' \
            '    </snapshot>' \
            '  </versioning>' \
            '</metadata>' > "$LOCAL_REPO/maven-metadata-local.xml"

          # Duplicate path with artifact subdirectory for POM self-dependency
          # (com.github.recloudstream.gradle:gradle:master-SNAPSHOT)
          LOCAL_REPO_ART="$BASE/gradle/gradle/master-SNAPSHOT"
          mkdir -p "$LOCAL_REPO_ART"
          cp "$BASE/gradle/master-SNAPSHOT/gradle-master-SNAPSHOT.jar" "$LOCAL_REPO_ART/gradle-master-SNAPSHOT.jar"
          cp "$BASE/gradle/master-SNAPSHOT/gradle-master-SNAPSHOT.pom" "$LOCAL_REPO_ART/gradle-master-SNAPSHOT.pom"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<metadata>' \
            '  <groupId>com.github.recloudstream.gradle</groupId>' \
            '  <artifactId>gradle</artifactId>' \
            '  <version>master-SNAPSHOT</version>' \
            '  <versioning>' \
            '    <snapshot>' \
            '      <localCopy>true</localCopy>' \
            '    </snapshot>' \
            '  </versioning>' \
            '</metadata>' > "$LOCAL_REPO_ART/maven-metadata-local.xml"

          echo "✅ Local JitPack repo ready (master-SNAPSHOT)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Build Environment
        run: |
          TAG_NAME=${GITHUB_REF_NAME#v}
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "OCE_VERSION=${TAG_NAME}" >> $GITHUB_ENV
          echo "✅ Build environment set for tag: $TAG_NAME"

      - name: Build Plugins
        run: |
          chmod +x ./gradlew
          ./gradlew make makePluginsJson --stacktrace
          
      - name: Patch plugins.json for Release
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # If triggered manually and no tag, use 'latest' or a dummy tag
          if [[ $TAG_NAME == refs/heads/* ]]; then
            TAG_NAME="latest"
          fi
          echo "Using Tag: $TAG_NAME"
          
          # Replace raw.githubusercontent.com URLs with release download URLs
          # Original: https://raw.githubusercontent.com/byimam2nd/oce/builds/ProviderName.cs3
          # Target: https://github.com/byimam2nd/oce/releases/download/$TAG_NAME/ProviderName.cs3
          sed -i "s|https://raw.githubusercontent.com/byimam2nd/oce/builds/|https://github.com/byimam2nd/oce/releases/download/$TAG_NAME/|g" build/plugins.json
          
          # Move artifacts to a staging directory
          mkdir -p release-artifacts
          cp **/build/*.cs3 release-artifacts/ 2>/dev/null || true
          cp build/plugins.json release-artifacts/ 2>/dev/null || true
          rm -f release-artifacts/BaseProvider.cs3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.cs3
            release-artifacts/plugins.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
