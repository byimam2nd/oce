name: Debug Anichin Runs

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours back'
        required: false
        default: '3'

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Query Anichin runs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HOURS: ${{ inputs.hours }}
        run: |
          python3 - << 'EOF'
import os, urllib.parse, urllib.request, json, sys
from datetime import datetime, timedelta, timezone

URL = os.environ["SUPABASE_URL"].rstrip("/")
KEY = os.environ["SUPABASE_ANON_KEY"]
HOURS = int(os.environ.get("HOURS", "3"))

def iso(ts): return ts.isoformat(timespec="seconds")
now = datetime.now(timezone.utc)
since = iso(now - timedelta(hours=HOURS))

q = [
  ("select", "id,source_id,context,status,started_at,error_message,error_type,start_url"),
  ("source_id", "eq.Anichin"),
  ("context", "eq.EPISODE"),
  ("started_at", f"gte.{since}"),
  ("order", "started_at.desc"),
  ("limit", "50")
]
req_url = f"{URL}/rest/v1/scrape_runs?{urllib.parse.urlencode(q)}"
req = urllib.request.Request(req_url, headers={
  "apikey": KEY, "Authorization": f"Bearer {KEY}", "Accept": "application/json"
})
with urllib.request.urlopen(req, timeout=30) as resp:
  rows = json.loads(resp.read().decode())

if not rows:
  print("Tidak ada run Anichin di window ini.")
else:
  print(f"# Anichin runs (last {HOURS}h): {len(rows)}")
  print()
  print("| waktu (UTC) | status | start_url | error |")
  print("|---|---|---|---|")
  for r in rows:
    t = r.get("started_at", "")[:19]
    st = r.get("status", "")
    url = r.get("start_url", "") or "-"
    err = r.get("error_message", "") or "-"
    if len(err) > 80: err = err[:77] + "..."
    print(f"| {t} | {st} | {url} | {err} |")
sys.exit(0)
EOF