name: CI/CD - Build

concurrency:
  group: "ci-cd"
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
      - '*/src/**'
      - '*/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  # ========================================
  # BUILD ALL PROVIDERS
  # ========================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout builds
        uses: actions/checkout@v5
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: |
          rm $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm $GITHUB_WORKSPACE/builds/*.jar || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Build Environment
        env:
          OCE_TG_TOKEN: ${{ secrets.OCE_TG_TOKEN }}
          OCE_TG_GROUP_ID: ${{ secrets.OCE_TG_GROUP_ID }}
          OCE_TG_THREAD_ID: ${{ secrets.OCE_TG_THREAD_ID }}
        run: |
          cd $GITHUB_WORKSPACE/src
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "OCE_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "✅ Build environment set"

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x ./gradlew
          shopt -s globstar nullglob

          echo "═══ Build (CI run: $BUILD_TIMESTAMP) ═══"
          ./gradlew make makePluginsJson ensureJarCompatibility --stacktrace || true

          # Collect build artifacts
          cs3_files=(**/build/*.cs3)
          jar_files=(**/build/*.jar)

          for f in "${cs3_files[@]}"; do cp "$f" $GITHUB_WORKSPACE/builds/ 2>/dev/null || true; done
          for f in "${jar_files[@]}"; do cp "$f" $GITHUB_WORKSPACE/builds/ 2>/dev/null || true; done
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          rm -f $GITHUB_WORKSPACE/builds/BaseProvider.cs3

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds

          echo "📋 Files in builds folder:"
          ls -la *.cs3 *.jar plugins.json 2>/dev/null || echo "Some files may be missing"

          if ls *.cs3 1> /dev/null 2>&1; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add *.cs3 2>/dev/null || true
            git add *.jar 2>/dev/null || true
            git add plugins.json 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "Build artifacts from $(date +'%Y-%m-%d %H:%M:%S')"
              git push
              echo "✅ Build artifacts pushed successfully"
            else
              echo "ℹ️ No new build artifacts to push"
            fi
          else
            echo "⚠️ No .cs3 build artifacts (only library code changed, skipping push)"
          fi