name: CI/CD - Build & Publish Beta

concurrency:
  group: "ci-cd"
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
      - '*/src/**'
      - '*/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  # ========================================
  # BUILD + TEST (always runs)
  # ========================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source (private)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-populate JitPack artifact in local Maven repo
        run: |
          BASE="$GITHUB_WORKSPACE/jitpack-local/com/github/recloudstream/gradle"
          LOCAL_REPO="$BASE/gradle/master-SNAPSHOT"
          mkdir -p "$LOCAL_REPO"
          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.jar" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.jar"
          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.pom" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.pom"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<metadata>' \
            '  <groupId>com.github.recloudstream.gradle</groupId>' \
            '  <artifactId>gradle</artifactId>' \
            '  <version>master-SNAPSHOT</version>' \
            '  <versioning>' \
            '    <snapshot>' \
            '      <localCopy>true</localCopy>' \
            '    </snapshot>' \
            '  </versioning>' \
            '</metadata>' > "$LOCAL_REPO/maven-metadata-local.xml"
          echo "✅ Local JitPack repo ready (master-SNAPSHOT)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Build Environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "OCE_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "SUPABASE_URL=${SUPABASE_URL}" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> $GITHUB_ENV
          echo "✅ Build environment set"

      - name: Validate provider configs
        run: |
          python3 scripts/validate_providers.py

      - name: Run BaseProvider unit tests
        run: |
          curl -sL "https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar" \
            -o /tmp/cs3-classes.jar
          CLOUDSTREAM3_JAR=/tmp/cs3-classes.jar ./gradlew :BaseProvider:testDebugUnitTest --stacktrace

      - name: Build Plugins (public repo URL)
        env:
          # Force plugins.json .cs3 URLs to point at the PUBLIC repo,
          # even though this workflow runs in the private source repo.
          OCE_REPO_URL: https://github.com/byimam2nd/oce
        run: |
          chmod +x ./gradlew
          echo "═══ Build (CI run: $BUILD_TIMESTAMP) ═══"
          ./gradlew make makePluginsJson ensureJarCompatibility --stacktrace
          mkdir -p /tmp/opencode-artifacts
          cp build/plugins.json /tmp/opencode-artifacts/ 2>/dev/null || true
          shopt -s globstar nullglob
          cs3_files=(**/build/*.cs3)
          for f in "${cs3_files[@]}"; do cp "$f" /tmp/opencode-artifacts/ 2>/dev/null || true; done
          rm -f /tmp/opencode-artifacts/BaseProvider.cs3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-artifacts
          path: /tmp/opencode-artifacts/

  # ========================================
  # PUBLISH BETA to PUBLIC repo builds branch
  # (only when GitHub App secret is configured)
  # ========================================
  publish-beta:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCE_DISTRIBUTOR_APP_ID: ${{ secrets.OCE_DISTRIBUTOR_APP_ID }}
      OCE_DISTRIBUTOR_APP_PEM: ${{ secrets.OCE_DISTRIBUTOR_APP_PEM }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OCE_DISTRIBUTOR_APP_ID }}
          private-key: ${{ secrets.OCE_DISTRIBUTOR_APP_PEM }}
          owner: byimam2nd
          repositories: oce

      - name: Checkout public distribution (builds branch)
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        uses: actions/checkout@v5
        with:
          repository: byimam2nd/oce
          ref: builds
          token: ${{ steps.app-token.outputs.token }}
          path: dist

      - name: Download artifacts
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        uses: actions/download-artifact@v4
        with:
          name: beta-artifacts
          path: dist

      - name: Deploy beta artifacts
        if: ${{ env.OCE_DISTRIBUTOR_APP_ID != '' && env.OCE_DISTRIBUTOR_APP_PEM != '' }}
        run: |
          cd dist
          ls -la *.cs3 plugins.json 2>/dev/null || echo "⚠️ No artifacts found"
          git config --local user.email "actions@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add -A .
          if ! git diff --cached --quiet; then
            git commit -m "Beta build from oce-source@${GITHUB_SHA:0:7}"
            git push origin builds
            echo "✅ Beta artifacts pushed to byimam2nd/oce@builds"
          else
            echo "ℹ️ No changes to publish"
          fi
